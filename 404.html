<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - 404</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .error-container {
            text-align: center;
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }

        .error-code {
            font-size: 7rem;
            font-weight: 800;
            color: #ff6b6b;
            line-height: 1;
            margin-bottom: 10px;
        }

        .error-title {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .error-message {
            font-size: 1rem;
            color: #7f8c8d;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .home-btn {
            display: inline-block;
            background-color: #4a90e2;
            color: #ffffff;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 25px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(74, 144, 226, 0.3);
            border: none;
            cursor: pointer;
        }

        .home-btn:hover {
            background-color: #357abd;
            transform: translateY(-2px);
        }

        .home-btn:active {
            transform: translateY(0);
        }

        .countdown {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #95a5a6;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Oops! Page not found</h1>
        <p class="error-message">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        
        <!-- Button to go to index.html -->
        <a href="https://soilpad.github.io" class="home-btn">Go Back Home</a>
        
        <div class="countdown" id="countdown-text">Redirecting to home in <span id="seconds">5</span> seconds...</div>
    </div>

    <script>
        // JavaScript: Optional auto-redirect countdown timer
        let timeLeft = 5;
        const countdownElement = document.getElementById('seconds');
        
        const timer = setInterval(() => {
            timeLeft--;
            countdownElement.textContent = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                window.location.replace('https://soilpad.github.io/');
            }
        }, 1000);
    </script>

</body>
</html>
